name: routing-training-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: routing_training
      POSTGRES_USER: routing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../schemas/sql/storage_ledger.sql:/docker-entrypoint-initdb.d/10-storage-ledger.sql:ro
      - ./init-db.sql:/docker-entrypoint-initdb.d/20-training-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routing -d routing_training"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [training]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [training]

  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      STORAGE_BUCKETS: ${STORAGE_BUCKETS:-raw-events normalized-events evidence replay-fixtures model-artifacts backups}
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
        echo "waiting for MinIO"
        sleep 2
      done
      until mc ready local; do
        echo "waiting for MinIO readiness"
        sleep 2
      done
      for bucket in $$STORAGE_BUCKETS; do
        mc mb --ignore-existing "local/$$bucket"
      done
      for bucket in raw-events normalized-events evidence replay-fixtures model-artifacts backups; do
        mc anonymous set none "local/$$bucket"
      done
      echo "storage buckets initialized"
    restart: "no"
    networks: [training]

volumes:
  postgres_data:
    name: routing_training_postgres
  minio_data:
    name: routing_training_minio

networks:
  training:
    name: routing_training
