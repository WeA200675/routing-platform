services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/region.osrm
    volumes:
      - ./data:/data:ro
    expose:
      - "5000"
    restart: unless-stopped

  navigation-adapter:
    image: python:3.12.7-slim
    working_dir: /app
    command: python /app/osrm_adapter.py
    environment:
      OSRM_URL: http://osrm:5000
      PORT: "8787"
    volumes:
      - ../:/app:ro
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      - osrm
    restart: unless-stopped
