syntax = "proto3";

package routing_platform.training.v1;

message PerformanceMetric {
  string metric_id = 1;
  string release_id = 2;
  string track = 3;
  string name = 4;
  double value = 5;
  double baseline_value = 6;
  double threshold = 7;
  uint64 sample_count = 8;
  int64 window_start_unix_ms = 9;
  int64 window_end_unix_ms = 10;
  bool critical = 11;
  bool regression = 12;
  string evidence_ref = 13;
}

message OptimizationCycle {
  string cycle_id = 1;
  string track = 2;
  string status = 3;
  string baseline_release_id = 4;
  string candidate_release_id = 5;
  double expected_gain = 6;
  double resource_cost = 7;
  bool regression_triggered = 8;
  string repair_task_id = 9;
}

message PerformanceGate {
  string release_id = 1;
  bool safety_passed = 2;
  bool critical_metrics_passed = 3;
  bool resource_budget_passed = 4;
  bool reproducible = 5;
  bool rollback_ready = 6;
  bool approved = 7;
  string reason = 8;
}
