name: Android and core verification

on:
  push:
    branches: [main, g620-integration-local, recovery/startup-crash-refactor]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('platform/android/**/*.gradle*', 'platform/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Debug assemble
        run: ./gradlew assembleDebug --no-daemon
