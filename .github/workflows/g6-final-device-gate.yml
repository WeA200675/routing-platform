name: G6 Final Device Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare G6 physical-device acceptance package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify immutable workflow action revisions
        run: python3 tools/g620/verify_workflow_action_pins.py
      - name: Verify G6 acceptance plan exists
        run: test -f docs/G6_ACCEPTANCE.md
      - name: Create one-click Pixel test instructions
        shell: bash
        run: |
          cat > g6-device-test.txt <<'EOF'
          G6 FINAL PHYSICAL DEVICE GATE
          
          1. Select one successful immutable Production Candidate run and record its exact 40-character source SHA.
          2. Download g620-physical-device-test from that exact run; do not use a moving 'latest' artifact.
          3. Extract g620-field-test.apk and its .sha256 file to C:\g6-rc.
          4. Verify the APK with: certutil -hashfile C:\g6-rc\g620-field-test.apk SHA256
             Compare the result with g620-field-test.apk.sha256.
          5. Connect the Pixel 10 Pro with USB debugging enabled and verify it appears in:
             C:\platform-tools\adb.exe devices -l
          6. Run: C:\platform-tools\adb.exe uninstall org.routingplatform.app
          7. Run: C:\platform-tools\adb.exe install C:\g6-rc\g620-field-test.apk
          8. Run: C:\platform-tools\adb.exe shell am start -n org.routingplatform.app/.ai.SocialAiDeviceTestActivity
          
          Required evidence: PASS, exact model/runtime SHA-256, non-empty local response, inference/recovery/total timings, available RAM, and Netzwerk-Fallback: keiner.
          Then exercise the product navigation flow with:
          Fahr mich nach Hause, vermeide Autobahnen und halte vorher an einem Supermarkt.
          
          Expected safety behavior: until exact deterministic motorway avoidance exists, the avoidance request must fail closed / request clarification; it must never silently map to LowUrban.
          EOF
      - name: Upload physical-device gate instructions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g6-physical-device-gate
          path: g6-device-test.txt
          retention-days: 14
