# Verification trigger: run the full Android test/lint/compile matrix on main.
name: Android CI
# Final verification trigger: rebuild APK after incident-capture integration
# Artifact delivery trigger

on:
  push:
    branches:
      - main
      - fix/verified-training-pipeline
      - "g6.*/*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, release compile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: platform/android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned Android components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Test, lint and compile release
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:compileReleaseKotlin \
            :app:assembleDebug

      - name: Generate debug APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/debug"
          test -d "$apk_dir"
          mapfile -d '' apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print0)
          test "${#apks[@]}" -eq 1
          (
            cd "$apk_dir"
            sha256sum "$(basename "${apks[0]}")" > SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
            printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
          )

      - name: Verify APK provenance and tamper-detection tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ../../scripts/test_verify_android_apk_artifact.py
          python3 ../../scripts/verify_android_apk_artifact.py \
            app/build/outputs/apk/debug "$GITHUB_SHA"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: routing-platform-debug-apk
          path: |
            platform/android/app/build/outputs/apk/**/*.apk
            platform/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            platform/android/app/build/outputs/apk/debug/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
