name: Android CI

on:
  push:
    branches:
      - main
      - "g6.*/*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, release compile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: platform/android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify immutable G6.20 candidate lock
        shell: bash
        working-directory: .
        run: python3 tools/g620/verify_candidate_lock.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned Android components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Test, lint and compile release
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            :app:assembleDebugAndroidTest

      - name: Test release artifact capture tooling
        shell: bash
        run: python3 ../../tools/g620/test_capture_candidate_artifact.py

      - name: Test pinned llama Android build recipe
        shell: bash
        run: python3 ../../tools/g620/test_build_llama_android.py

      - name: Test captured candidate lock binding
        shell: bash
        run: python3 ../../tools/g620/test_verify_captured_candidate.py

      - name: Verify release APK contains no unreviewed LLM native runtime
        shell: bash
        run: |
          python3 ../../tools/g620/verify_release_apk.py \
            app/build/outputs/apk/release/app-release-unsigned.apk
