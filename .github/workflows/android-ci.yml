name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, release compile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: platform/android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Test, lint and compile release
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:compileReleaseKotlin