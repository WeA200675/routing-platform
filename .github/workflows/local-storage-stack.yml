name: local-storage-stack

on:
  pull_request:
    paths:
      - deploy/**
      - schemas/sql/storage_ledger.sql
      - scripts/verify-local-storage-stack.sh
      - .github/workflows/local-storage-stack.yml
  push:
    branches: [main]
    paths:
      - deploy/**
      - schemas/sql/storage_ledger.sql
      - scripts/verify-local-storage-stack.sh
      - .github/workflows/local-storage-stack.yml

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose --env-file deploy/.env.local.example -f deploy/docker-compose.local.yml config
      - name: Start and verify services
        run: sh scripts/verify-local-storage-stack.sh
