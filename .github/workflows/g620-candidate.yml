name: G6.20 Real Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build pinned local-LLM candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned NDK and CMake
        shell: bash
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Run real pinned candidate pipeline
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          tools/g620/run_real_candidate_pipeline.sh "$RUNNER_TEMP/g620" "$ANDROID_HOME/ndk/28.2.13676358"
      - name: Capture native artifact
        shell: bash
        run: |
          SO="$(find "$RUNNER_TEMP/g620/build/llama-android" -type f -name libllama.so -print -quit)"
          test -n "$SO"
          python3 tools/g620/capture_native_artifact.py --runtime-commit b23701f77d47dad9de834d59ebfcbe25c9e8b46f --ndk-version 28.2.13676358 --cmake-version 3.22.1 --abi arm64-v8a --artifact "$SO" --output "$RUNNER_TEMP/g620/build/native-capture.json"
      - name: Show immutable evidence hashes
        shell: bash
        run: |
          sha256sum "$RUNNER_TEMP/g620/build/model-capture.json"
          sha256sum "$RUNNER_TEMP/g620/build/native-capture.json"
          cat "$RUNNER_TEMP/g620/build/model-capture.json"
          cat "$RUNNER_TEMP/g620/build/native-capture.json"
      - name: Upload candidate evidence
        uses: actions/upload-artifact@v6
        with:
          name: g620-candidate-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/g620/build/model-capture.json
            ${{ runner.temp }}/g620/build/native-capture.json
