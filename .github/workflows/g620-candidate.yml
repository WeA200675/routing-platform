name: G6.20 Real Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - g6.20/local-open-source-llm
    paths:
      - .github/workflows/g620-candidate.yml
      - tools/g620/**
      - platform/android/app/build.gradle.kts
      - platform/android/app/src/main/java/org/routingplatform/app/ai/**
      - platform/android/app/src/main/java/org/routingplatform/app/MainActivity.kt
      - platform/android/app/src/main/java/org/routingplatform/app/ui/**
      - platform/android/app/src/main/java/org/routingplatform/app/navigation/**
      - platform/android/app/src/main/java/org/routingplatform/app/security/**
      - platform/android/app/src/test/**
      - platform/android/app/src/main/AndroidManifest.xml
      - platform/android/app/src/debug/AndroidManifest.xml
      - platform/android/app/src/release/**
      - docs/G*_ACCEPTANCE.md
      - backend/**

concurrency:
  group: g620-real-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build pinned local-LLM candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify immutable workflow action revisions
        run: python3 tools/g620/verify_workflow_action_pins.py
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install pinned NDK and CMake
        shell: bash
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Run real pinned candidate pipeline
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          bash tools/g620/run_real_candidate_pipeline.sh "$RUNNER_TEMP/g620" "$ANDROID_HOME/ndk/28.2.13676358"
      - name: Build and capture JNI-enabled device runtime
        shell: bash
        run: |
          SOURCE_SHA="$(git -C "$RUNNER_TEMP/g620/inputs/llama.cpp" archive --format=tar HEAD | sha256sum | awk '{print $1}')"
          python3 tools/g620/build_social_ai_device_runtime.py \
            --source "$RUNNER_TEMP/g620/inputs/llama.cpp" \
            --commit b23701f77d47dad9de834d59ebfcbe25c9e8b46f \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
            --build-dir "$RUNNER_TEMP/g620/build/social-ai-device" \
            --source-sha256 "$SOURCE_SHA"
          SO="$(find "$RUNNER_TEMP/g620/build/social-ai-device" -type f -name libsocial_ai_llama.so -print -quit)"
          test -n "$SO"
          cp "$SO" "$RUNNER_TEMP/g620/build/libsocial_ai_llama.so"
          python3 tools/g620/capture_native_artifact.py --runtime-commit b23701f77d47dad9de834d59ebfcbe25c9e8b46f --ndk-version 28.2.13676358 --cmake-version 3.22.1 --abi arm64-v8a --artifact "$RUNNER_TEMP/g620/build/libsocial_ai_llama.so" --output "$RUNNER_TEMP/g620/build/native-capture.json"
      - name: Capture pinned runtime source digest
        shell: bash
        run: |
          git -C "$RUNNER_TEMP/g620/inputs/llama.cpp" archive --format=tar HEAD | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/g620/build/runtime-source.sha256"
      - name: Create deterministic release evidence
        shell: bash
        run: |
          python3 tools/g620/create_release_evidence.py --candidate-lock tools/g620/candidate.lock --model-capture "$RUNNER_TEMP/g620/build/model-capture.json" --native-capture "$RUNNER_TEMP/g620/build/native-capture.json" --source-sha256 "$(cat "$RUNNER_TEMP/g620/build/runtime-source.sha256")" --output-dir "$RUNNER_TEMP/g620/build/evidence"
      - name: Show immutable evidence hashes
        shell: bash
        run: |
          sha256sum "$RUNNER_TEMP/g620/build/model-capture.json" "$RUNNER_TEMP/g620/build/native-capture.json" "$RUNNER_TEMP/g620/build/evidence/g620-sbom.spdx.json" "$RUNNER_TEMP/g620/build/evidence/g620-release-manifest.json"
          cat "$RUNNER_TEMP/g620/build/model-capture.json"
          cat "$RUNNER_TEMP/g620/build/native-capture.json"
          cat "$RUNNER_TEMP/g620/build/evidence/g620-release-manifest.json"
      - name: Package reviewed native candidate into release APK
        shell: bash
        run: |
          JNI_DIR="platform/android/app/src/main/jniLibs/arm64-v8a"
          MODEL_DIR="platform/android/app/src/main/assets/g620"
          mkdir -p "$JNI_DIR" "$MODEL_DIR"
          cp "$RUNNER_TEMP/g620/build/libsocial_ai_llama.so" "$JNI_DIR/libsocial_ai_llama.so"
          cp "$RUNNER_TEMP/g620/inputs/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf" "$MODEL_DIR/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"
          chmod +x platform/android/gradlew
          platform/android/gradlew -p platform/android --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
          MERGED_MANIFEST="$(find platform/android/app/build/intermediates/merged_manifests/release -type f -name AndroidManifest.xml -print -quit)"
          test -n "$MERGED_MANIFEST"
          if grep -q 'android:usesCleartextTraffic="true"' "$MERGED_MANIFEST"; then
            echo "Release manifest permits cleartext traffic" >&2
            exit 1
          fi
          if grep -Eq 'G5R5FaultProbeActivity|G5R6DriveProofControlActivity|SocialAiDeviceTestActivity' "$MERGED_MANIFEST"; then
            echo "Debug/device diagnostic activity leaked into release manifest" >&2
            exit 1
          fi
          if ! grep -q 'SecurityDiagnosticsActivity' "$MERGED_MANIFEST" || ! grep -A4 'SecurityDiagnosticsActivity' "$MERGED_MANIFEST" | grep -q 'android:exported="false"'; then
            echo "Authenticated security diagnostics surface missing or exported" >&2
            exit 1
          fi
          if grep -Eq 'BLUETOOTH_SCAN|NEARBY_WIFI_DEVICES|CHANGE_WIFI_STATE' "$MERGED_MANIFEST"; then
            echo "Release manifest contains prohibited active radio scan/change permission" >&2
            exit 1
          fi
          if ! grep -q 'android:allowBackup="false"' "$MERGED_MANIFEST"; then
            echo "Release manifest permits app-data backup" >&2
            exit 1
          fi
          APK="$(find platform/android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 tools/g620/verify_release_apk.py "$APK" --release-manifest "$RUNNER_TEMP/g620/build/evidence/g620-release-manifest.json"
          # assembleRelease is intentionally unsigned unless a production signing
          # configuration is supplied. Sign the RC deterministically with the
          # Android SDK debug key so the exact reviewed candidate is installable
          # on physical test devices without introducing repository secrets.
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$DEBUG_KEYSTORE")"
            keytool -genkeypair -v -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$DEBUG_KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out "$RUNNER_TEMP/g620/build/g620-release.apk" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/g620/build/g620-release.apk"
          APK_SHA="$(sha256sum "$RUNNER_TEMP/g620/build/g620-release.apk" | awk '{print $1}')"
          echo "$APK_SHA  g620-release.apk" > "$RUNNER_TEMP/g620/build/g620-release.apk.sha256"
          python3 -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); d=json.loads(p.read_text()); d["releaseApkSha256"]=sys.argv[2].lower(); p.write_text(json.dumps(d,indent=2,sort_keys=True)+chr(10))' "$RUNNER_TEMP/g620/build/evidence/g620-release-manifest.json" "$APK_SHA"
          python3 tools/g620/verify_release_apk.py "$RUNNER_TEMP/g620/build/g620-release.apk" --release-manifest "$RUNNER_TEMP/g620/build/evidence/g620-release-manifest.json"
      - name: Upload candidate evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g620-candidate-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/g620/build/model-capture.json
            ${{ runner.temp }}/g620/build/native-capture.json
            ${{ runner.temp }}/g620/build/runtime-source.sha256
            ${{ runner.temp }}/g620/build/evidence/g620-sbom.spdx.json
            ${{ runner.temp }}/g620/build/evidence/g620-release-manifest.json
            ${{ runner.temp }}/g620/build/g620-release.apk
            ${{ runner.temp }}/g620/build/g620-release.apk.sha256
