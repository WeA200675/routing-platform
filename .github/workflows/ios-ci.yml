name: iOS Contract CI

on:
  push:
    branches:
      - main
      - "g6.*/*"
  pull_request:
    branches:
      - main
    paths:
      - 'platform/ios/**'
      - 'platform/shared/parity/**'
      - '.github/workflows/ios-ci.yml'
      - 'docs/P19_P27_ACCEPTANCE.md'
      - 'docs/P28_P36_ACCEPTANCE.md'
      - '.github/workflows/g620-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-contract:
    name: Swift package tests
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/ios
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Verify immutable workflow action revisions
        working-directory: ${{ github.workspace }}
        run: python3 tools/g620/verify_workflow_action_pins.py
      - name: Show Swift version
        run: swift --version
      - name: Build iOS contract package
        run: swift build
      - name: Test iOS contract package
        run: swift test
